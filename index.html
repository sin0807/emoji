<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情绪日历</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <button id="prevMonth">&lt;</button>
            <h1 id="monthYear"></h1>
            <button id="nextMonth">&gt;</button>
        </div>
        <div class="weekdays">
            <div>日</div>
            <div>一</div>
            <div>二</div>
            <div>三</div>
            <div>四</div>
            <div>五</div>
            <div>六</div>
        </div>
        <div class="calendar" id="calendar"></div>
        <div class="mood-legend">
            <span class="mood-item"><span class="mood-icon">😊</span> 开心</span>
            <span class="mood-item"><span class="mood-icon">😐</span> 普通</span>
            <span class="mood-item"><span class="mood-icon">😢</span> 难过</span>
        </div>
    </div>

    <div class="modal" id="moodModal">
        <div class="modal-content">
            <p>选择今天的心情？</p>
          <textarea id="moodInput" placeholder="用一句话描述今天的心情..." rows="3" style="width:100%;margin:10px 0;padding:8px;border-radius:8px;border:1px solid #ddd;"></textarea>
        <button id="submitMood" style="margin-right:8px;">让AI分析 ✨</button>
        <button class="cancel-btn" id="cancelMood">取消</button>
        <p id="moodResult" style="margin-top:8px;color:#888;"></p>
    </div>
</div>

    <script src="script.js"></script>
</body>
</html>
