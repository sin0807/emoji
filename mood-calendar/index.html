<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情绪日历</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <button id="prevMonth">&lt;</button>
            <h1 id="monthYear"></h1>
            <button id="nextMonth">&gt;</button>
        </div>
        <div class="weekdays">
            <div>日</div>
            <div>一</div>
            <div>二</div>
            <div>三</div>
            <div>四</div>
            <div>五</div>
            <div>六</div>
        </div>
        <div class="calendar" id="calendar"></div>
        <div class="mood-legend">
            <span class="mood-item"><span class="mood-icon">😊</span> 开心</span>
            <span class="mood-item"><span class="mood-icon">😐</span> 普通</span>
            <span class="mood-item"><span class="mood-icon">😢</span> 难过</span>
        </div>
        <div class="chart-section">
            <h3 id="chartTitle"></h3>
            <canvas id="moodChart"></canvas>
        </div>
    </div>

    <div class="modal" id="moodModal">
        <div class="modal-content">
            <p>今天感觉怎么样？</p>
            <input type="text" id="moodTextInput" placeholder="输入一句话描述你的心情..." style="width:100%;padding:10px;margin-bottom:10px;border-radius:6px;border:1px solid #ccc;box-sizing:border-box;">
            <button id="analyzeMoodBtn" style="width:100%;padding:10px;background:#6c5ce7;color:white;border:none;border-radius:6px;cursor:pointer;font-size:16px;">🤖 让AI分析情绪</button>
            <p id="moodResult" style="text-align:center;font-size:24px;margin:10px 0;"></p>
            <p id="aiReply" style="text-align:center;font-size:14px;color:#666;margin:8px 0;min-height:40px;"></p>
            <button class="cancel-btn" id="cancelMood">取消</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
