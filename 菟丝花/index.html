<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>菟丝花 - 你不孤单，她们也走过来了</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Georgia', 'Noto Serif SC', 'Songti SC', serif;
      background-color: #F0F7FF;
      color: #2C3E50;
      min-height: 100vh;
      line-height: 1.8;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* 顶部 */
    header {
      text-align: center;
      margin-bottom: 50px;
    }

    h1 {
      font-size: 3.5em;
      font-weight: 400;
      color: #5B9EC9;
      letter-spacing: 0.15em;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1.1em;
      color: #5B9EC9;
      font-style: italic;
      opacity: 0.85;
    }

    /* 输入区 */
    #input-section {
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(91, 158, 201, 0.15);
      margin-bottom: 30px;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      border: 2px solid #B8D4E8;
      border-radius: 12px;
      padding: 20px;
      font-size: 1.05em;
      font-family: inherit;
      color: #2C3E50;
      background: #FAFCFF;
      resize: vertical;
      outline: none;
      transition: border-color 0.3s;
    }

    textarea:focus {
      border-color: #5B9EC9;
    }

    textarea::placeholder {
      color: #8BAFC8;
      font-style: italic;
    }

    .btn-row {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    button {
      background: #5B9EC9;
      color: white;
      border: none;
      padding: 14px 40px;
      font-size: 1.05em;
      border-radius: 30px;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.1em;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(91, 158, 201, 0.3);
    }

    button:hover {
      background: #4A8AB5;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(91, 158, 201, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      background: #B8D4E8;
      cursor: not-allowed;
      transform: none;
    }

    /* 加载动画 */
    #loading {
      text-align: center;
      padding: 40px;
      color: #5B9EC9;
      font-size: 1.1em;
      font-style: italic;
    }

    .loading-dots::after {
      content: '';
      animation: dots 1.5s infinite;
    }

    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }

    /* 结果区 */
    #结果区域 {
      margin-top: 20px;
    }

    #结果区域 h2 {
      text-align: center;
      font-weight: 400;
      font-size: 1.3em;
      color: #5B9EC9;
      margin-bottom: 25px;
      letter-spacing: 0.1em;
    }

    .匹配卡片 {
      background: white;
      border-radius: 14px;
      padding: 24px 28px;
      margin-bottom: 16px;
      box-shadow: 0 3px 15px rgba(91, 158, 201, 0.12);
      cursor: pointer;
      transition: all 0.3s;
      border-left: 4px solid transparent;
    }

    .匹配卡片:hover {
      transform: translateX(4px);
      box-shadow: 0 5px 20px rgba(91, 158, 201, 0.2);
    }

    .匹配标签 {
      display: inline-block;
      font-size: 0.8em;
      padding: 3px 10px;
      border-radius: 12px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .高度匹配 .匹配标签 {
      background: #FFF0F0;
      color: #D44;
    }

    .高度匹配 {
      border-left-color: #D44;
    }

    .中度匹配 .匹配标签 {
      background: #FFFDE0;
      color: #A88;
    }

    .中度匹配 {
      border-left-color: #A88;
    }

    .低度匹配 .匹配标签 {
      background: #F0FFF0;
      color: #6A8;
    }

    .低度匹配 {
      border-left-color: #6A8;
    }

    .人物名 {
      font-size: 1.3em;
      color: #2C3E50;
      margin-bottom: 4px;
    }

    .人物年代 {
      font-size: 0.85em;
      color: #8BAFC8;
      margin-bottom: 10px;
    }

    .人物简介 {
      font-size: 0.95em;
      color: #5B7A8A;
      line-height: 1.7;
    }

    /* 弹窗 */
    .弹窗遮罩 {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(44, 62, 80, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      padding: 20px;
    }

    .弹窗遮罩.active {
      opacity: 1;
      pointer-events: all;
    }

    .弹窗内容 {
      background: white;
      border-radius: 20px;
      max-width: 580px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 36px;
      box-shadow: 0 10px 40px rgba(91, 158, 201, 0.25);
      position: relative;
    }

    .弹窗关闭 {
      position: absolute;
      top: 18px;
      right: 20px;
      background: none;
      border: none;
      font-size: 1.8em;
      color: #B8D4E8;
      cursor: pointer;
      padding: 5px;
      line-height: 1;
      box-shadow: none;
    }

    .弹窗关闭:hover {
      color: #5B9EC9;
      transform: none;
    }

    .弹窗标题 {
      font-size: 1.8em;
      color: #5B9EC9;
      margin-bottom: 5px;
      letter-spacing: 0.08em;
    }

    .弹窗年代 {
      font-size: 0.9em;
      color: #8BAFC8;
      margin-bottom: 25px;
    }

    .弹窗区块 {
      margin-bottom: 22px;
    }

    .弹窗区块标题 {
      font-size: 0.85em;
      color: #5B9EC9;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 0.12em;
    }

    .弹窗区块内容 {
      font-size: 1em;
      color: #3D5A6A;
      line-height: 1.85;
    }

    .弹窗原话 {
      background: #F0F7FF;
      border-left: 3px solid #5B9EC9;
      padding: 14px 18px;
      font-style: italic;
      color: #4A6A7A;
      border-radius: 0 10px 10px 0;
      margin-top: 20px;
    }

    /* 页脚 */
    footer {
      text-align: center;
      margin-top: 60px;
      color: #8BAFC8;
      font-size: 0.85em;
      font-style: italic;
    }

    /* 响应式 */
    @media (max-width: 600px) {
      h1 {
        font-size: 2.5em;
      }

      .container {
        padding: 25px 15px;
      }

      #input-section {
        padding: 20px;
      }

      .弹窗内容 {
        padding: 24px 20px;
      }

      .弹窗标题 {
        font-size: 1.5em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>菟丝花</h1>
      <p class="subtitle">你并不孤单，她们也走过来了</p>
    </header>

    <main>
      <section id="input-section">
        <textarea id="困境输入" placeholder="说说你正在经历什么……"></textarea>
        <div class="btn-row">
          <button id="寻找按钮">寻找同行者</button>
        </div>
      </section>

      <section id="loading" class="hidden">
        <div class="loading-text">正在寻找同行者<span class="loading-dots"></span></div>
      </section>

      <section id="结果区域" class="hidden">
        <h2她们也曾走过这样的路</h2>
        <div id="匹配结果"></div>
      </section>
    </main>

    <footer>
      <p>不比较苦难，只传递陪伴</p>
    </footer>
  </div>

  <!-- 详情弹窗 -->
  <div id="弹窗" class="弹窗遮罩">
    <div class="弹窗内容">
      <button class="弹窗关闭" id="弹窗关闭">×</button>
      <div id="弹窗主体"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
